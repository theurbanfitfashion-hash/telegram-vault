name: Deploy Telegram Vault backend to Development

on:
  push:
    branches:
      - feat/permanent-account-auth
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-vault-development-deploy
  cancel-in-progress: false

jobs:
  deploy-development:
    # This workflow is deliberately restricted to the feature branch.
    if: github.ref == 'refs/heads/feat/permanent-account-auth'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Convex functions to the selected Development deployment
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex dev --once
