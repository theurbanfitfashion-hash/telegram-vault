name: Deploy Convex backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/convex/**"
      - "convex.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-convex.yml"

concurrency:
  group: telegram-vault-main-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy backend and generate client types
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Add CONVEX_DEPLOY_KEY in GitHub repository Actions secrets."
            exit 1
          fi
          # First initialize the deployment context; env commands need this.
          npx convex dev --once
          npx convex env set SITE_URL=https://telegram-vault-web.onrender.com

          # Keep existing signing keys stable; only create them if either is missing.
          ENV_LIST="$(npx convex env list)"
          if ! printf '%s\n' "$ENV_LIST" | grep -q 'JWT_PRIVATE_KEY' || ! printf '%s\n' "$ENV_LIST" | grep -q 'JWKS'; then
            node --input-type=module <<'NODE'
          import { generateKeyPairSync, createPublicKey } from "node:crypto";
          import { spawnSync } from "node:child_process";

          const { privateKey, publicKey } = generateKeyPairSync("rsa", {
            modulusLength: 2048,
            privateKeyEncoding: { type: "pkcs8", format: "pem" },
            publicKeyEncoding: { type: "spki", format: "pem" },
          });
          const jwk = createPublicKey(publicKey).export({ format: "jwk" });
          const jwks = JSON.stringify({ keys: [{ use: "sig", ...jwk }] });
          const values = [
            ["JWT_PRIVATE_KEY", privateKey.trimEnd().replace(/\n/g, " ")],
            ["JWKS", jwks],
          ];
          for (const [name, value] of values) {
            const result = spawnSync("npx", ["convex", "env", "set", `${name}=${value}`], { stdio: "inherit" });
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          NODE
          fi
          npx convex codegen
      - name: Commit generated Convex types
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/convex/_generated
          if ! git diff --cached --quiet; then
            git commit -m "chore: update generated Convex types [skip ci]"
            git push origin HEAD:main
          fi
